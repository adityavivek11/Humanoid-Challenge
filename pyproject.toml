[project]
name = "g1cascade"
version = "0.1.0"
description = "Phase-aware compute cascade + distilled student policy for a G1 + Dex3-1 hand, trained on self-recorded human demos"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
